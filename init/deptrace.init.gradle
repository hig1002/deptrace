// DepTrace exporter: 분석 대상 빌드 파일을 수정하지 않고 Gradle 의존성 해석 결과를 JSON으로 추출한다.
// 실행: ./gradlew -I <path>/deptrace.init.gradle deptraceExport --no-configuration-cache
//
// 추출 항목
//  - nodes: 해석된 구성요소와 Gradle이 기록한 선택 사유(ComponentSelectionReason)
//  - edges: 요청된 좌표·버전(requested) → 실제 선택된 구성요소(selected), BOM/platform 제약 여부
//  - managedVersions: io.spring.dependency-management 플러그인이 관리하는 버전 (있을 때만)
//  - directDependencies: 빌드 스크립트에 직접 선언된 의존성과 선언 버전
import groovy.json.JsonOutput
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

def deptraceConfigurations = (System.getProperty('deptrace.configurations')
        ?: 'productionRuntimeClasspath,runtimeClasspath,testRuntimeClasspath').split(',')*.trim()

allprojects {
    tasks.register('deptraceExport') {
        group = 'deptrace'
        description = 'Exports resolved dependency graphs with selection reasons as JSON.'
        notCompatibleWithConfigurationCache('reads resolution results of the project at execution time')
        doLast {
            def dm = project.extensions.findByName('dependencyManagement')
            def managed = dm != null ? new TreeMap(dm.managedVersions) : [:]

            deptraceConfigurations.each { name ->
                def conf = project.configurations.findByName(name)
                if (conf == null || !conf.canBeResolved) return

                def declared = []
                conf.hierarchy.each { c ->
                    c.dependencies.each { d ->
                        if (d.group != null) declared << [group: d.group, name: d.name, version: d.version, declaredIn: c.name]
                    }
                }

                def root = conf.incoming.resolutionResult.rootComponent.get()
                def nodes = [:]
                def edges = []
                def queue = new ArrayDeque([root])
                def seen = [] as Set
                while (!queue.isEmpty()) {
                    def c = queue.poll()
                    if (!seen.add(c.id)) continue
                    nodes[c.id.displayName] = [
                            module : c.moduleVersion ? "${c.moduleVersion.group}:${c.moduleVersion.name}" : null,
                            version: c.moduleVersion?.version,
                            reasons: c.selectionReason.descriptions.collect { [cause: it.cause.name(), description: it.description] }
                    ]
                    c.dependencies.each { d ->
                        if (d instanceof ResolvedDependencyResult) {
                            edges << [from: c.id.displayName, requested: d.requested.displayName,
                                      to: d.selected.id.displayName, constraint: d.constraint]
                            queue << d.selected
                        } else if (d instanceof UnresolvedDependencyResult) {
                            edges << [from: c.id.displayName, requested: d.requested.displayName,
                                      constraint: d.constraint, unresolved: true]
                        }
                    }
                }

                def out = project.layout.buildDirectory.file("deptrace/${name}.json").get().asFile
                out.parentFile.mkdirs()
                out.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                        format            : 'deptrace-graph/1',
                        project           : project.path,
                        configuration     : name,
                        gradleVersion     : project.gradle.gradleVersion,
                        root              : root.id.displayName,
                        directDependencies: declared,
                        managedVersions   : managed,
                        nodes             : nodes,
                        edges             : edges
                ]))
                logger.lifecycle("deptrace: wrote ${out} (${nodes.size()} nodes, ${edges.size()} edges)")
            }
        }
    }
}
